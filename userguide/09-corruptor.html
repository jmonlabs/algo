  <title>9. Corruptor</title>

  <script id="0" type="text/markdown">
    # 9. Corruptor

    Algorithmic music tends to sound sterile. Every note lands exactly on the grid, every pitch is perfectly in tune, every velocity is uniform. Real music isn't like that — players rush and drag, instruments go out of tune, energy fades over a long take.

    The Corruptor is a post-processing module that degrades "perfect" compositions to make them sound more organic. It works on any JMON piece and applies five independent techniques, each controlled by a global `entropy` parameter (0 to 1):

    - **Temporal jitter** — breaks the rigid time grid
    - **Microtonal drift** — detunes pitches slightly
    - **Note attrition** — randomly drops notes
    - **Velocity sag** — reduces energy over time
    - **Ghost tracks** — adds deep, slow shadow layers

    At low entropy (0–0.3), you get subtle humanization. At medium (0.4–0.7), things start to wobble. At high entropy (0.8–1.0), controlled destruction.
  </script>

  <script id="1" type="module" pinned="">
    import jm from "../src/index.js";
    import sound from "https://cdn.jsdelivr.net/gh/jmonlabs/sound@main/src/index.js";
    import * as Tone from "npm:tone";
    import verovio from "npm:verovio@4.3.1/wasm";
    import { VerovioToolkit } from "npm:verovio@4.3.1/esm";
    import * as Plot from "npm:@observablehq/plot@0.6";
  </script>

  <script id="2" type="text/markdown">
    ## A simple scale to corrupt

    We'll use a C major scale as source material — boring enough that any corruption is easy to hear.
  </script>

  <script id="3" type="module" pinned="">
    const original = {
      title: "Clean scale",
      tempo: 120,
      tracks: [{
        label: "Melody",
        synth: 0,
        notes: [
          { pitch: 60, duration: 1, time: 0, velocity: 0.8 },
          { pitch: 62, duration: 1, time: 1, velocity: 0.8 },
          { pitch: 64, duration: 1, time: 2, velocity: 0.8 },
          { pitch: 65, duration: 1, time: 3, velocity: 0.8 },
          { pitch: 67, duration: 1, time: 4, velocity: 0.8 },
          { pitch: 69, duration: 1, time: 5, velocity: 0.8 },
          { pitch: 71, duration: 1, time: 6, velocity: 0.8 },
          { pitch: 72, duration: 1, time: 7, velocity: 0.8 }
        ]
      }]
    };

    display(await jm.score(original, { verovio, VerovioToolkit }));
    display(await jm.play(original, { Tone, sound }));
  </script>

  <script id="4" type="text/markdown">
    ## Quick usage

    The simplest way to corrupt a piece is with the `corruptJmon` function with a value of entropy (0–1).
  </script>

  <script id="5" type="module" pinned="">
    const corrupted = jm.processors.corruptJmon(original, 0.8);
    display(await jm.score({ ...corrupted, title: "Corrupted (entropy 0.8)" }, { verovio, VerovioToolkit }));
    display(await jm.play(corrupted, { Tone, sound }));
  </script>

  <script id="6" type="text/markdown">
    Entropy can be applied on pitch, timing, missing notes, velocity.
    
    ## Temporal jitter

    Every note in algorithmic music falls exactly on a grid subdivision. Temporal jitter displaces notes in time using either Perlin noise (smooth, continuous drift) or a Brownian bridge (random walk that returns to zero). The amount scales with entropy.
  </script>

  <script id="7" type="module">
    const entropies = [0.0, 0.3, 0.6, 0.9];

    const jitterData = entropies.flatMap(entropy => {
      const corruptor = new jm.processors.Corruptor({
        entropy,
        temporalJitter: true,
        microtonalDrift: false,
        noteAttrition: false,
        velocitySag: false,
        seed: 42
      });
      const result = corruptor.corrupt(original);
      return result.tracks[0].notes.map((note, i) => ({
        note: i,
        deviation: note.time - original.tracks[0].notes[i].time,
        entropy: `${entropy}`
      }));
    });

    display(jitterData)
    display(Plot.plot({
      title: "Time deviation by entropy level",
      height: 250, width: 700,
      color: { legend: true },
      x: { label: "Note" },
      y: { label: "Deviation (beats)" },
      marks: [
        Plot.ruleY([0], { stroke: "#ccc", strokeDasharray: "2,2" }),
        Plot.line(jitterData, { x: "note", y: "deviation", stroke: "entropy" })
      ]
    }));
  </script>

  <script id="8" type="text/markdown">
    At entropy 0.0, no deviation. At 0.9, notes shift by up to half a beat — the rhythm starts limping.

    ## Microtonal drift

    Acoustic instruments drift out of tune, analog oscillators wander with temperature, tape machines introduce wow and flutter. Microtonal drift applies Gaussian-distributed pitch deviations to JMON's `microtuning` property (in semitones). Most notes stay close to pitch; a few drift noticeably.
  </script>

  <script id="9" type="module">
    const driftCorruptor = new jm.processors.Corruptor({
      entropy: 0.6,
      temporalJitter: false,
      microtonalDrift: true,
      noteAttrition: false,
      velocitySag: false,
      seed: 123
    });

    const drifted = driftCorruptor.corrupt(original);
    const driftData = drifted.tracks[0].notes.map((n, i) => ({
      note: i,
      microtuning: n.microtuning || 0
    }));

    display(Plot.plot({
      title: "Microtonal drift (entropy 0.6)",
      height: 200, width: 700,
      x: { label: "Note" },
      y: { label: "Drift (semitones)" },
      marks: [
        Plot.ruleY([0], { stroke: "#ccc", strokeDasharray: "2,2" }),
        Plot.line(driftData, { x: "note", y: "microtuning", stroke: "#e74c3c" })
      ]
    }));

    display(await jm.score({ ...drifted, title: "Drifted (entropy 0.6)" }, { verovio, VerovioToolkit }));
    display(await jm.play(drifted, { Tone, sound }));
  </script>

  <script id="10" type="text/markdown">
    ## Note attrition and velocity sag

    Two forms of structural decay:

    - **Note attrition** randomly drops notes at high entropy (> 0.7), creating gaps — like a degraded recording with dropouts.
    - **Velocity sag** gradually reduces velocity over time, simulating a player getting tired or a battery running low.

    We'll use a longer phrase to make the effect visible.
  </script>

  <script id="11" type="module">
    const longPhrase = {
      tempo: 120,
      tracks: [{
        label: "Loop",
        synth: 0,
        notes: Array.from({ length: 32 }, (_, i) => ({
          pitch: 60 + (i % 8),
          duration: 0.5,
          time: i * 0.5,
          velocity: 0.8
        }))
      }]
    };

    const decayed = new jm.processors.Corruptor({
      entropy: 0.85,
      temporalJitter: false,
      microtonalDrift: false,
      noteAttrition: true,
      velocitySag: true,
      seed: 347
    }).corrupt(longPhrase);

    const originalVel = longPhrase.tracks[0].notes.map((n, i) => ({
      time: n.time, velocity: n.velocity, type: "Original"
    }));
    const decayedVel = decayed.tracks[0].notes.map(n => ({
      time: n.time, velocity: n.velocity, type: "Corrupted"
    }));

    display(Plot.plot({
      title: `Velocity sag and attrition (${longPhrase.tracks[0].notes.length} to ${decayed.tracks[0].notes.length} notes)`,
      height: 200, width: 700,
      color: { legend: true },
      x: { label: "Time (beats)" },
      y: { label: "Velocity", domain: [0, 1] },
      marks: [
        Plot.line(originalVel, { x: "time", y: "velocity", stroke: "type", strokeDasharray: "4,2" }),
        Plot.dot(decayedVel, { x: "time", y: "velocity", fill: "type", r: 3 })
      ]
    }));

    display(await jm.play(decayed, { Tone, sound }));
  </script>

  <script id="12" type="text/markdown">
    The gaps from attrition and the fading velocity are both clearly visible. Notes that survived still lose energy toward the end of the phrase.

    ## Ghost tracks

    For each melodic track, the Corruptor can generate a "ghost" — a delayed shadow that enters after the melody, transposed down, stretched, and quieted. Unlike simple voicing (which doubles notes at the same time), ghost notes are offset by a configurable delay (default: 1 beat) and drift in time with Perlin noise, so they feel like an echo trailing behind the melody rather than a parallel layer.
  </script>

  <script id="13" type="module" pinned="">
    const ghosted = new jm.processors.Corruptor({
      entropy: 0.3,
      temporalJitter: false,
      microtonalDrift: false,
      noteAttrition: false,
      velocitySag: false,
      ghostTrack: true,
      ghostOctaveShift: -1,
      ghostDurationMultiplier: 4,
      ghostVelocityMultiplier: 0.3
    }).corrupt(original);

    display("Tracks: " + ghosted.tracks.length + " (" + ghosted.tracks.map(t => t.label).join(", ") + ")");

    display(await jm.score({ ...ghosted, title: "Melody + Ghost" }, { verovio, VerovioToolkit }));
    display(await jm.play(ghosted, { Tone, sound }));
  </script>

  <script id="14" type="text/markdown">
    ## Everything at once

    The interesting results come from combining all techniques. Here's a two-track piece (pad + arpeggio) with full corruption at entropy 0.65.
  </script>

  <script id="15" type="module" pinned="">
    const piece = {
      tempo: 110,
      tracks: [{
        label: "Pad",
        synth: 89,
        notes: Array.from({ length: 16 }, (_, i) => ({
          pitch: 48 + [0, 4, 7, 11, 12, 11, 7, 4][i % 8],
          duration: 2,
          time: i * 2,
          velocity: 0.7
        }))
      }, {
        label: "Arpeggio",
        synth: 0,
        notes: Array.from({ length: 64 }, (_, i) => ({
          pitch: 60 + [0, 4, 7, 12, 7, 4][i % 6],
          duration: 0.25,
          time: i * 0.25,
          velocity: 0.6
        }))
      }]
    };

    const fullCorrupt = new jm.processors.Corruptor({
      entropy: 0.65,
      temporalJitter: true,
      jitterMethod: 'perlin',
      microtonalDrift: true,
      noteAttrition: true,
      velocitySag: true,
      ghostTrack: true,
      seed: 789
    }).corrupt(piece);

    display("Original: " + piece.tracks.map(t => t.notes.length + " notes").join(", "));
    display("Corrupted: " + fullCorrupt.tracks.map(t => t.notes.length + " notes").join(", "));

    display(await jm.score({ ...fullCorrupt, title: "Full corruption (entropy 0.65)" }, { verovio, VerovioToolkit }));
    display(await jm.play(fullCorrupt, { Tone, sound }));
  </script>

  <script id="16" type="text/markdown">
    ## Entropy spectrum

    How does each corruption metric scale with entropy? We'll run the same 20-note phrase through all entropy levels and measure the average effect:
  </script>

  <script id="17" type="module">
    const testPhrase = {
      tempo: 120,
      tracks: [{
        label: "Test",
        notes: Array.from({ length: 20 }, (_, i) => ({
          pitch: 60, duration: 0.5, time: i * 0.5, velocity: 0.8
        }))
      }]
    };

    const levels = Array.from({ length: 11 }, (_, i) => i / 10);

    const spectrum = levels.map(entropy => {
      const result = new jm.processors.Corruptor({
        entropy,
        temporalJitter: true,
        microtonalDrift: true,
        noteAttrition: true,
        velocitySag: true,
        seed: 999
      }).corrupt(testPhrase);

      const notes = result.tracks[0].notes;
      return {
        entropy,
        drift: notes.reduce((s, n) => s + Math.abs(n.microtuning || 0), 0) / notes.length,
        jitter: notes.reduce((s, n, i) => s + Math.abs(n.time - i * 0.5), 0) / notes.length,
        lost: testPhrase.tracks[0].notes.length - notes.length
      };
    });

    const spectrumData = spectrum.flatMap(d => [
      { entropy: d.entropy, value: d.drift, metric: "Avg drift (semitones)" },
      { entropy: d.entropy, value: d.jitter, metric: "Avg jitter (beats)" },
      { entropy: d.entropy, value: d.lost / 20, metric: "Notes lost (fraction)" }
    ]);

    display(Plot.plot({
      title: "Corruption metrics vs. entropy",
      height: 250, width: 700,
      color: { legend: true },
      x: { label: "Entropy", domain: [0, 1] },
      y: { label: "Value" },
      marks: [
        Plot.line(spectrumData, { x: "entropy", y: "value", stroke: "metric" }),
        Plot.dot(spectrumData, { x: "entropy", y: "value", fill: "metric", r: 2 })
      ]
    }));
  </script>

  <script id="18" type="text/markdown">
    All three metrics are near zero at low entropy and ramp up non-linearly. Note attrition only kicks in above ~0.7 — at lower levels, every note survives but timing and pitch wobble.

    ## Integration with other modules

    The Corruptor works on any JMON piece, so you can chain it after a cellular automaton, a Mandelbrot extraction, a genetic algorithm, or anything else that produces notes. Here's a quick example with a Rule 30 cellular automaton:
  </script>

  <script id="19" type="module">
    const ca = new jm.generative.automata.Cellular({
      ruleNumber: 30,
      width: [60, 72],
      initialState: Array(13).fill(0).map((_, i) => i === 6 ? 1 : 0)
    });
    ca.generate(16);

    // toPlotData returns {time, pitch} for every active cell
    const plotData = ca.toPlotData();
    const notes = plotData.map(d => ({
      pitch: d.pitch,
      time: d.time * 0.25,
      duration: 0.25,
      velocity: 0.7
    }));

    const caPiece = { tempo: 140, tracks: [{ label: "Rule 30", notes }] };
    const caCorrupted = jm.processors.corruptJmon(caPiece, 0.5, {
      temporalJitter: true,
      microtonalDrift: true,
      ghostTrack: true,
      seed: 4645
    });

    display("CA original: " + caPiece.tracks[0].notes.length + " notes, 1 track");
    display("CA corrupted: " + caCorrupted.tracks[0].notes.length + " notes, " + caCorrupted.tracks.length + " tracks");

    display(await jm.play(caCorrupted, { Tone, sound }));
  </script>
