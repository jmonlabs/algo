  <script id="0" type="text/markdown">
    # 10. Live coding

    The previous chapters used `jm.play(composition)` — call it, get a player, hear the piece from the top. That's the offline mode: every change re-renders, every restart rewinds. Useful for composing, not for *playing*.

    `jmon/live` is the live-coding surface: an iframe player that holds a persistent Tone.js transport, accepts pattern updates over `postMessage`, and swaps them in at the next loop or bar boundary so edits don't tear the beat. Same JMON format, same synth factory, just a different transport contract.

    Two ways to use it:

    - **From a notebook** — embed the iframe (Observable, this user guide, any HTML page) and post patterns to it from cells. Re-running a cell mid-loop updates the music without restarting.
    - **The standalone REPL** — `algo/live/repl.html`. Open it directly, type pattern code on the left, Ctrl/Cmd+Enter sends it to the embedded player on the right. No notebook host needed.
  </script>

  <script id="1" type="module" pinned="">
    import jm from "../src/index.js";
  </script>

  <script id="2" type="text/markdown">
    ## Embedding the player

    The player is `live/index.html` — a tiny iframe document that boots Tone.js, listens for `postMessage`, and renders. Point an iframe at it from anywhere:
  </script>

  <script id="3" type="module" pinned="">
    // jsDelivr serves the in-repo player with the correct MIME type.
    // For local dev, you can also point at "./live/index.html" relative to
    // wherever the notebook is served.
    const playerUrl = "https://cdn.jsdelivr.net/gh/jmonlabs/algo/live/index.html";

    const player = html`<iframe
      src="${playerUrl}"
      style="width:100%;height:140px;border:1px solid #ccc;border-radius:4px"
      allow="midi"></iframe>`;

    // The player broadcasts a "ready" message once it's loaded. We resolve a
    // promise on the first one so cells below can await it.
    const ready = new Promise((resolve) => {
      window.addEventListener("message", function once(e) {
        if (e.data && e.data.type === "ready") {
          window.removeEventListener("message", once);
          resolve();
        }
      });
    });

    display(player);
    await ready;
  </script>

  <script id="4" type="text/markdown">
    Click the player once — browsers require a user gesture before audio can start.

    ## Sending a pattern

    The player accepts `{ type: "update", pattern, mode }` over `postMessage`. The pattern is plain JMON; the mode controls when the swap takes effect.
  </script>

  <script id="5" type="module" pinned="">
    // Helper for the rest of the chapter.
    const send = (msg) => player.contentWindow.postMessage(msg, "*");

    const scale = jm.key("C", "major").scale().generate({ start: 60, length: 8 });
    const melody = scale.map((p, i) => ({
      pitch: p, time: i * 0.5, duration: "8n", velocity: 0.7
    }));

    const pattern = {
      format: "jmon", version: "1.0", tempo: 120, timeSignature: "4/4",
      tracks: [{ label: "lead", notes: melody }]
    };

    send({ type: "update", pattern });
    display(pattern);
  </script>

  <script id="6" type="text/markdown">
    The pattern loops on its own musical duration (one bar in this case), not on its event count. Re-run the cell with a different `scale` length or `tempo` and you'll hear the change land on the next loop boundary — no audio gap.

    ## Swap modes

    The `mode` field controls when a new pattern takes effect:

    | mode          | when it swaps                                  |
    |---------------|------------------------------------------------|
    | `next-loop`   | At the end of the currently-playing loop (default) |
    | `next-bar`    | At the next bar boundary, even mid-loop        |
    | `immediate`   | Right now — useful for first send or hard cuts |

    `next-loop` is the right default for live coding: edits feel responsive but the music never tears. `next-bar` is for sharper handoffs (chord changes, drops). `immediate` is for the very first pattern or for resetting.
  </script>

  <script id="7" type="module" pinned="">
    // Same melody, faster — lands on the next bar instead of waiting out the loop.
    send({
      type: "update",
      mode: "next-bar",
      pattern: { ...pattern, tempo: 160 }
    });
  </script>

  <script id="8" type="text/markdown">
    ## Per-track routing

    Each JMON track may set `synth`, `pan`, `midiChannel`, and `midiProgram`. These are spec fields (see [chapter 5](05-sounds.html)); the live player honors them all:

    - `synth` — a Tone.js synth type (`"PolySynth"`, `"MonoSynth"`, …), a GM program number (0–127), or an inline `{type, options}` object. Sampled instruments come from `jmon/sound`, which the live player loads itself rather than taking as an argument — the iframe fetches its own Tone.js too. It is the same bank and the same synth factory `jm.play` uses, so a track sounds the same live and offline.
    - `pan` — stereo position, -1 (left) to +1 (right). For MIDI tracks it's sent as CC 10.
    - `midiChannel` — set this to route the track over Web MIDI instead of Tone audio. 0..15.
    - `midiProgram` — General MIDI program (0..127) sent as a program change on `midiChannel`.

    A multi-track example mixing all of these:
  </script>

  <script id="9" type="module" pinned="">
    const K = jm.key("C", "major");
    const padScale = K.scale().generate({ start: 60, length: 8 });
    const triad = (root) => [padScale[root - 1], padScale[root + 1], padScale[root + 3]];

    const multi = {
      format: "jmon", version: "1.0", tempo: 96, timeSignature: "4/4",
      tracks: [
        // Drone — default PolySynth, dead center.
        { label: "drone", notes: [
          { pitch: ["C2", "G2", "C3"], time: 0, duration: "1n", velocity: 0.25 }
        ]},
        // Pad — explicit PolySynth with a slow envelope, panned slightly left.
        { label: "pad",
          pan: -0.3,
          synth: { type: "PolySynth",
            options: { envelope: { attack: 0.4, decay: 0.4, sustain: 0.7, release: 1.2 } } },
          notes: [
            { pitch: triad(1), time: 0, duration: "4n", velocity: 0.32 },
            { pitch: triad(4), time: 1, duration: "4n", velocity: 0.28 },
            { pitch: triad(5), time: 2, duration: "4n", velocity: 0.28 },
            { pitch: triad(1), time: 3, duration: "4n", velocity: 0.32 }
          ]
        },
        // Violin — GM program 40, panned right. First notes may be silent
        // while the SoundFont samples stream from CDN.
        { label: "violin",
          synth: 40, pan: 0.4,
          notes: [60, 64, 67, 72, 67, 64].map((p, i) => ({
            pitch: p, time: i * 0.5, duration: "8n", velocity: 0.65
          }))
        }
      ]
    };

    send({ type: "update", pattern: multi });
  </script>

  <script id="10" type="text/markdown">
    ## Loop events

    The player broadcasts `{ type: "loop", iteration, beat, audioTime }` back to its parent every time it crosses a loop boundary. Useful for syncing visuals, advancing a seed, or scheduling further updates exactly on the bar.
  </script>

  <script id="11" type="module" pinned="">
    const loopCounter = html`<div style="font-family:monospace;padding:8px">loop: —</div>`;
    display(loopCounter);

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "loop") {
        loopCounter.textContent = `loop: ${e.data.iteration} (beat ${e.data.beat})`;
      }
    });
  </script>

  <script id="12" type="text/markdown">
    ## Other commands

    The player accepts a small protocol over `postMessage`:

    | message                                          | effect                                                                |
    |--------------------------------------------------|-----------------------------------------------------------------------|
    | `{ type: "update", pattern, mode }`              | Apply pattern; `mode` is `next-loop` (default), `next-bar`, or `immediate` |
    | `{ type: "stop" }`                               | Pause the transport                                                   |
    | `{ type: "resume" }`                             | Resume the transport                                                  |
    | `{ type: "reset" }`                              | Stop, rewind to beat 0, then resume                                   |
    | `{ type: "setTempo", tempo }`                    | Change BPM mid-loop                                                   |
    | `{ type: "enableMidi" }`                         | Request Web MIDI access; player replies `{ type: "midi", info }`      |
    | `{ type: "setMidiOutput", output }`              | Choose a MIDI output by name                                          |

    Web MIDI lets you drive a DAW: bridge through an OS virtual MIDI port (IAC on macOS, loopMIDI on Windows, snd-virmidi on Linux) and any track with `midiChannel` set goes out instead of through Tone audio.

    ## The standalone REPL

    `algo/live/repl.html` is a single page with a code buffer on the left, the same player iframe on the right, a swap-mode dropdown, MIDI controls, and a "Load demo" button. Ctrl/Cmd+Enter sends the buffer to the player. No notebook host needed.

    Open it directly:

    - From the repo: `live/repl.html`
    - From the CDN: [cdn.jsdelivr.net/gh/jmonlabs/algo/live/repl.html](https://cdn.jsdelivr.net/gh/jmonlabs/algo/live/repl.html)

    The buffer is plain JavaScript run as an async function. It can `await import("https://esm.sh/gh/jmonlabs/algo")` and use the full library; a `scope` object survives between runs so you can advance a seed, cache a key, or hold any per-session state:

    ```javascript
    scope.algo ??= await import("https://esm.sh/gh/jmonlabs/algo");
    const jm = scope.algo.default ?? scope.algo;
    scope.seed = (scope.seed ?? 0) + 1;

    const walk = new jm.generative.walks.Chain({
      walkRange: [0, 14], walkStart: 7,
      walkProbability: [-1, 0, 1], roundTo: 0
    }).line(16, scope.seed);

    const scale = jm.key("C", "major").scale().generate({ start: 60, length: 15 });
    pattern = {
      format: "jmon", version: "1.0", tempo: 110,
      tracks: [{
        label: "lead",
        synth: 40,
        notes: walk.map((i, k) => ({
          pitch: scale[i], time: k * 0.25, duration: "16n", velocity: 0.6
        }))
      }]
    };
    ```

    Hit Run, edit, Run again — the walk re-rolls each time because the seed advances. The "Load demo" button in the header populates the buffer with a multi-track example (drone, pad, walked bass, GM violin) you can pick apart.
  </script>
