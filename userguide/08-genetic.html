  <script id="0" type="text/markdown">
    # 8. Genetic algorithms

    Genetic algorithms borrow ideas from natural selection to evolve solutions over successive generations. Start with a sequence of musical objects.

    ```
    [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨]
    ```

    Clone it to get a population. But cloning isn't perfect. Mutations happen.

    ```
    [
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨],
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨],
        [🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨],
        [🟨, 🟨, 🟥, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨],
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨]
    ]
    ```

    Some mutations help, some don't. We score each individual to find out.

    ```
    [
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨], : score 58
        [🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨], : score 56
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨], : score 50
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨], : score 50
        [🟨, 🟨, 🟥, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨]  : score 34
    ]
    ```

    The best survivors breed to create children. Children inherit traits from either parent, and mutations can appear again.

    ```
    [
        [🟩, 🟨, 🟨, 🟨, 🟨, 🟨, 🟥, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨], : score 67
        [🟨, 🟩, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟩, 🟨, 🟨]  : score 62
        [🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟦, 🟨, 🟨, 🟨, 🟨], : score 61
        [🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨], : score 50
        [🟨, 🟨, 🟨, 🟨, 🟦, 🟩, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨, 🟨], : score 46
    ]
    ```

    And so on. Given an initial population, scoring criteria, mutation rates and a number of generations, we can "evolve" a piece of music.
  </script>

  <script id="2" type="text/markdown">
    ## The `Darwin` class

    The `Darwin` class handles the evolution process, while `MusicalIndex` handles scoring.

    ### 1. Population

    Evolution starts from an initial population - a list of notes in jmon/algo format where each note is `[pitch, duration, time]`. This population is the gene pool from which new musical ideas will emerge. We'll use Twinkle, Twinkle Little Star in C major as our starting point.
  </script>
  <script id="3" type="module" pinned="">
    const initialPhrases = [
      [
        [60, 1.0, 0.0],  // C (twin)
        [60, 1.0, 1.0],  // C (kle)
        [67, 1.0, 2.0],  // G (twin)
        [67, 1.0, 3.0],  // G (kle)
        [69, 1.0, 4.0],  // A (lit)
        [69, 1.0, 5.0],  // A (tle)
        [67, 2.0, 6.0],  // G (star)
        [65, 1.0, 8.0],  // F (how)
        [65, 1.0, 9.0],  // F (I)
        [64, 1.0, 10.0], // E (won)
        [64, 1.0, 11.0], // E (der)
        [62, 1.0, 12.0], // D (what)
        [62, 1.0, 13.0], // D (you)
        [60, 2.0, 14.0], // C (are)
      ]
    ];

    display("Initial phrase:");
    display(initialPhrases[0]);
  </script>
  <script id="4" type="text/markdown">
    ### 2. Fitness evaluation

    Each phrase is scored on how well it meets quantitative criteria: pitch diversity, rhythmic balance, motif repetition, and so on. The `MusicalIndex` class computes these metrics, and an overall fitness score is the weighted similarity to predefined targets. Higher fitness means closer to the compositional goals. Since we start from clones, all individuals in the initial population have the same score - until mutations kick in. Here are the metrics for our starting phrase.
  </script>
  <script id="5" type="module" pinned="">
    // Extract pitch and duration sequences
    const pInitial = initialPhrases[0].map(note => note[0]);
    const rInitial = initialPhrases[0].map(note => note[1]);

    // Create C major scale for dissonance calculation
    const cMajorScale = new jm.theory.harmony.Scale({ tonic: 'C', mode: 'major' });
    const cMajorPitches = cMajorScale.generate({ start: 'C0', end: 127 });

    // Calculate metrics
    const pitchIndex = new jm.analysis.MusicalIndex(pInitial);
    const rhythmIndex = new jm.analysis.MusicalIndex(rInitial);

    const giniPitchInitial = pitchIndex.gini();
    const giniRhythmInitial = rhythmIndex.gini();
    const balancePitchInitial = pitchIndex.balance();
    const balanceRhythmInitial = rhythmIndex.balance();
    const motifPitchInitial = pitchIndex.motif();
    const motifRhythmInitial = rhythmIndex.motif();
    const dissonanceInitial = pitchIndex.dissonance(cMajorPitches);
    const rhythmicInitial = rhythmIndex.rhythmic(4);
    const restInitial = pitchIndex.restProportion();

    const initialValues = [
      giniPitchInitial,
      giniRhythmInitial,
      balancePitchInitial,
      balanceRhythmInitial,
      motifPitchInitial,
      motifRhythmInitial,
      dissonanceInitial,
      rhythmicInitial,
      restInitial
    ];

    const categories = [
      "Gini pitch",
      "Gini rhythm",
      "Balance pitch",
      "Balance rhythm",
      "Motif pitch",
      "Motif rhythm",
      "Dissonance",
      "Rhythmic",
      "Rest"
    ];

    display(Plot.plot({
      title: "Initial phrase metrics",
      marginLeft: 120,
      x: { label: "Score", domain: [0, 1] },
      y: { label: null },
      marks: [
        Plot.barX(categories.map((cat, i) => ({ category: cat, value: initialValues[i] })), {
          x: "value",
          y: "category"
        })
      ]
    }));
  </script>
  <script id="6" type="text/markdown">
    ### 3. Mutation

    Mutation introduces random changes to pitch, duration, or timing. The `mutationRate` parameter controls how often this happens. Too low and the population stagnates; too high and you get noise.

    ```js
    const mutated = demoDarwin.mutate(initialPhrases[0].map(note => [...note]));
    ```

    ### 4. Selection

    The fittest individuals survive and become parents for the next generation.

    **API call.**

    ```js
    const parents = demoDarwin.select(5);
    ```

    ### 5. Crossover

    Two parents exchange segments to produce offspring - like genetic recombination. The children combine traits from both parents, plus any new mutations.

    ```js
    const child = demoDarwin.crossover(parents[0], parents[1]);
    ```

    ### 6. Evolution

    The full cycle - mutate, select, crossover - repeats for many generations. Fitness should climb and eventually plateau.

    ```js
    const stats = demoDarwin.evolve(5);
    ```
  </script>
  <script id="6a" type="module">
    const demoScale = cMajorScale.generate({ start: 'C3', end: 'C6' });
    const demoDarwin = new jm.generative.genetic.Darwin({
      initialPhrases: initialPhrases,
      mutationRate: 0.05,
      populationSize: 40,
      scale: demoScale,
      measureLength: 4,
      timeResolution: [0.25, 4],
      seed: 7
    });

    globalThis.demoDarwin = demoDarwin;

    const mutationExample = demoDarwin.mutate(initialPhrases[0].map(note => [...note]));
    const selectedParents = demoDarwin.select(5);
    const crossoverChild = demoDarwin.crossover(selectedParents[0], selectedParents[1]);
    const generationStats = demoDarwin.evolve(5);

    display({
      mutationPreview: mutationExample.slice(0, 4),
      parentFitness: selectedParents.slice(0, 3).map(phrase => demoDarwin.fitness(phrase)),
      crossoverPreview: crossoverChild.slice(0, 4),
      generationStats
    });
  </script>
  <script id="7" type="module" pinned="">
    // Configure weights and targets
    const weights = {
      gini: [1.0, 1.0, 0.0],      // [pitch, duration, offset]
      balance: [1.0, 1.0, 0.0],
      motif: [10.0, 1.0, 0.0],
      dissonance: [1.0, 0.0, 0.0],
      rhythmic: [0, 10.0, 0],
      rest: [1.0, 0.0, 0.0]
    };

    const targets = {
      gini: [0.2, 0.5, 0.0],
      balance: [0.5, 0.1, 0.0],
      motif: [0.8, 0.5, 0.0],
      dissonance: [0.05, 0.0, 0.0],
      rhythmic: [0.0, 1.0, 0.0],
      rest: [0.0, 0.0, 0.0]
    };

    // Narrow the scale to a musical range around the initial phrase (C3–C6)
    // so pitch mutations stay close to the original register
    const evolverScale = cMajorScale.generate({ start: 'C3', end: 'C6' });

    // Create the evolver
    const evolver = new jm.generative.genetic.Darwin({
      initialPhrases: initialPhrases,
      mutationRate: 0.05,
      populationSize: 200,
      scale: evolverScale,
      measureLength: 4,
      timeResolution: [0.25, 4],
      weights: weights,
      targets: targets,
      seed: 111
    });

    display("Darwin evolver created with population size: " + evolver.populationSize);
  </script>
  <script id="8" type="text/markdown">
    ### Configuring the evolution

    The `weights` control how much each metric matters; the `targets` define the ideal value for each. The `scale` parameter limits which pitches mutations can pick from.

    A few practical tips:

    - **`mutationRate`**: keep it between 0.02 and 0.15. Above that, phrases become noisy; below, evolution stalls.
    - **`populationSize`**: 40–250 works well. Larger populations explore more but run slower.
    - **`timeResolution`**: pair it with `measureLength` so durations snap to your rhythmic grid.
    - **`k` in `evolve(k)`**: the number of parents selected each generation. 10–25 is a good range.

    Below we run 12 generations with `evolve(10)` - each round selects the 10 fittest parents, breeds them, and mutates the offspring.
  </script>
  <script id="9" type="module" pinned="">
    // Run evolution
    for (let i = 0; i < 12; i++) {
      evolver.evolve(10); // k=10 parents selected each generation
    }

    // Snapshot data so downstream cells see the evolved state
    const bestScores = [...evolver.bestScores];
    const bestIndividuals = evolver.bestIndividuals.map(ind => [...ind]);
    const finalPhrase = evolver.getBestIndividual();

    display("Evolution complete! Ran " + evolver.generationCount + " generations");
  </script>
  <script id="10" type="text/markdown">
    The fitness of the best individual at each generation should climb and then level off.
  </script>

  <script id="18" type="text/markdown">
    ## Custom mutation probabilities

    By default, pitch mutations pick a random note from the `scale` array. You can override this with `mutationProbabilities` - an object with `pitch()`, `duration()`, and `rest()` functions that return the mutated value.

    The example below restricts pitch mutations to G3–G5, favors short durations, and increases the chance of rests. The shaded area in the plot shows one standard deviation around the mean fitness.
  </script>
  <script id="19" type="module">
    // Example with custom mutation probabilities
    const customMutationProbs = {
      pitch: () => {
        // Favor pitches in a specific range (e.g., middle register)
        const base = 55 + Math.floor(Math.random() * 24); // G3 to G5
        return Math.max(0, Math.min(127, base));
      },
      duration: () => {
        // Favor shorter note values
        const choices = [0.25, 0.5, 1, 2];
        const weights = [4, 3, 2, 1]; // Favor shorter durations
        const totalWeight = weights.reduce((a, b) => a + b, 0);
        let random = Math.random() * totalWeight;
        for (let i = 0; i < choices.length; i++) {
          random -= weights[i];
          if (random <= 0) return choices[i];
        }
        return choices[choices.length - 1];
      },
      rest: () => {
        // Slightly higher chance of rests
        return Math.random() < 0.05 ? null : 1;
      }
    };

    const customEvolver = new jm.generative.genetic.Darwin({
      initialPhrases: initialPhrases,
      mutationRate: 0.08,
      populationSize: 100,
      mutationProbabilities: customMutationProbs,
      scale: cMajorPitches,
      measureLength: 4,
      timeResolution: [0.25, 2],
      seed: 42
    });

    // Run a few generations and track stats
    const populationStats = [];

    for (let i = 0; i < 50; i++) {
      customEvolver.evolve(10);
      const stats = customEvolver.getPopulationStats();
      populationStats.push(stats);
    }

    // Plot fitness diversity over time
    const diversityData = populationStats.map((stats, i) => ({
      generation: i,
      mean: stats.meanFitness,
      stdDev: stats.standardDeviation
    }));

    display(Plot.plot({
      title: "Population fitness diversity",
      width: 700,
      height: 400,
      x: { label: "Generation" },
      y: { label: "Fitness" },
      marks: [
        Plot.areaY(diversityData, {
          x: "generation",
          y1: d => d.mean - d.stdDev,
          y2: d => d.mean + d.stdDev,
          fill: "lightblue",
          opacity: 0.3
        }),
        Plot.line(diversityData, { x: "generation", y: "mean" })
      ]
    }));
  </script>
  <script id="22" type="text/markdown">
    When the shaded band narrows, the population is converging — most individuals are similarly fit. A wide band means high diversity, which isn't necessarily bad unless the mean fitness isn't climbing. If the band stays wide and flat, try lowering `mutationRate` or narrowing the `scale`.
  </script>
