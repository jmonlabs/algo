# 5. Sounds

This chapter covers how to shape sounds with JMON audio capabilities powered by Tone.js. With JMON's audio features, you can select synthetizers and instruments, apply audio effects, and export your compositions as WAV. By exporting to MIDI, you can also take your compositions into any DAW for further sound design.
  </script>

  <script type="module" pinned>
import jm from "../src/index.js";
import sound from "https://cdn.jsdelivr.net/gh/jmonlabs/sound@main/src/index.js";
import * as Tone from "npm:tone";
import verovio from "npm:verovio@4.3.1/wasm";
import { VerovioToolkit } from "npm:verovio@4.3.1/esm";
  </script>

  <script type="text/markdown">
## 1. Default playback

By default, `jm.play()` uses a **PolySynth** for every track. This is a general-purpose synthesizer that works well for prototyping.
  </script>

  <script type="module" pinned>
// A simple melody to use throughout this chapter
const melody = [
  { pitch: 60, duration: 1, time: 0, velocity: 0.8 },   // C
  { pitch: 64, duration: 1, time: 1, velocity: 0.8 },   // E
  { pitch: 67, duration: 1, time: 2, velocity: 0.8 },   // G
  { pitch: 72, duration: 1, time: 3, velocity: 0.8 },   // C5
  { pitch: 67, duration: 1, time: 4, velocity: 0.8 },   // G
  { pitch: 64, duration: 1, time: 5, velocity: 0.8 },   // E
  { pitch: 60, duration: 2, time: 6, velocity: 0.8 }, // E
];

const defaultPiece = {
  title: "Default PolySynth",
  tempo: 120,
  tracks: [{ notes: melody }]
};

display(await jm.score(defaultPiece, { verovio, VerovioToolkit }));
display(await jm.play(defaultPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
## 2. Choosing a synth

Set `track.synth` to a Tone.js synth class name to change the sound. Available synths:

- **"PolySynth"** — Default, plays multiple notes at once
- **"Synth"** — Simple monophonic synth
- **"MonoSynth"** — Monophonic with filter envelope
- **"FMSynth"** — Frequency modulation synthesis
- **"AMSynth"** — Amplitude modulation synthesis
- **"PluckSynth"** — Karplus-Strong plucked string
  </script>

  <script type="module" pinned>
const synthTypes = ["PolySynth", "FMSynth", "AMSynth", "PluckSynth"];

for (const synthName of synthTypes) {
  const piece = {
    title: synthName,
    tempo: 120,
    tracks: [{ notes: melody, synth: synthName }]
  };
  display(await jm.play(piece, { Tone, sound }));
}
  </script>

  <script type="text/markdown">
## 3. Sampled instruments

Set `track.synth` to a **number** (0-127) for a General MIDI instrument: real recordings from the FluidR3 soundfont, fetched from a CDN. All 128 programs are available.

These come from a separate package, **`jmon/sound`**, which you pass in the same way you pass `Tone` and `verovio`:

```js
import jm    from "https://cdn.jsdelivr.net/gh/jmonlabs/algo@main/src/index.js";
import sound from "https://cdn.jsdelivr.net/gh/jmonlabs/sound@main/src/index.js";

jm.play(piece, { Tone, sound });
```

That split is deliberate. `jmon/algo` composes and schedules; playing the result with recorded instruments is a different job, and keeping it out means `jm.play()` stays small. **Leave `sound` out and everything still plays** — a track asking for a GM program falls back to a synth, audible and in time but not the instrument you wrote.

Common GM program numbers:
| Number | Instrument |
|--------|-----------|
| 0 | Acoustic grand piano |
| 19 | Church organ |
| 24 | Acoustic guitar (nylon) |
| 25 | Acoustic guitar (steel) |
| 40 | Violin |
| 42 | Cello |
| 48 | String ensemble |
| 56 | Trumpet |
| 73 | Flute |
  </script>

  <script type="module" pinned>
// Piano melody with violin accompaniment
const pianoMelody = melody.map(n => ({ ...n, velocity: 0.7 }));
const violinHarmony = [
  { pitch: 55, duration: 4, time: 0, velocity: 0.5 },   // G3
  { pitch: 52, duration: 4, time: 4, velocity: 0.5 }    // E3
];

const gmPiece = {
  title: "Piano and violin (GM instruments)",
  tempo: 120,
  tracks: [
    { notes: pianoMelody, synth: 0, label: "Piano" },
    { notes: violinHarmony, synth: 40, label: "Violin" }
  ]
};

display(await jm.score(gmPiece, { verovio, VerovioToolkit }));
display(await jm.play(gmPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
Samples are fetched on first use, so the opening notes may be silent while they load.

### How many samples

`Sampler` fills the gaps between recordings by resampling — the same thing a soundfont engine does — so there is no need for one file per semitone. The default asks for about 25 files per instrument, every major third:

```js
{ synth: 40 }                             // balanced, the default
{ synth: { gm: 40, strategy: "minimal" } }   //  9 files — sketching
{ synth: { gm: 40, strategy: "quality" } }   // 30 files
{ synth: { gm: 40, strategy: "complete" } }  // 88 files — one per semitone
```

Resampling shifts formants, which is audible on voice, strings and brass, and inaudible on percussion. Reach for `complete` when a sustained instrument is exposed; the cost is 88 requests instead of 25.

### What a sampled note does that a synth note does not

Two behaviours worth knowing, because both are things you would otherwise notice and wonder about.

**A held note keeps sounding.** Every FluidR3 recording is a fixed 3.19 seconds. A longer note used to run out of sound — a whole note at 60 BPM ended in silence. The sample's sustaining region is looped instead, with the join levelled and crossfaded so it neither clicks nor pulses. Recordings that *decay* — piano, guitar, anything plucked — are measured and left alone, because they are supposed to die away.

**A glissando keeps the instrument.** A slide ramps the playback rate of the sounding voices, so a violin glissando is still a violin. On a plain `PolySynth` the slide has to move to a stand-in voice, and the timbre goes with it.

Two things the loop cannot restore. The **attack** is intact — playback starts at the beginning of the recording. The **release** is not the sample's own tail, because the end of the recording is never reached; the note finishes on a 0.1 s fade, which is abrupt under a long string note:

```js
{ synth: { gm: 48, options: { release: 0.6 } } }   // a longer tail
{ synth: { gm: 48, loopSustain: false } }          // don't loop at all
```
  </script>

  <script type="text/markdown">
### Naming an instrument once

`customPresets` defines a synth at composition level so several tracks can share it — and a preset's `type` may be a Tone class name **or** a GM program number.
  </script>

  <script type="module" pinned>
const quartet = {
  title: "One preset, three tracks",
  tempo: 90,
  customPresets: [
    { id: "strings", type: 48, strategy: "quality", options: { release: 0.6 } }
  ],
  tracks: [
    { label: "Violin I",  synth: "strings", notes: [{ pitch: 72, duration: 4, time: 0, velocity: 0.5 }] },
    { label: "Violin II", synth: "strings", notes: [{ pitch: 67, duration: 4, time: 0, velocity: 0.5 }] },
    // A track can borrow the preset and still adjust one thing.
    { label: "Cello", synth: { preset: "strings", options: { release: 1.2 } },
      notes: [{ pitch: 48, duration: 4, time: 0, velocity: 0.6 }] }
  ]
};

display(await jm.play(quartet, { Tone, sound }));
  </script>

  <script type="text/markdown">
## 4. Your own samples

The kit registry maps a MIDI note to a file. Drums are the obvious use, but nothing about it is percussive: one file per key is also how you play spoken word, field recordings, or any other set of one-shots. A stanza per note, say.

**1. Find audio your browser is allowed to fetch.** This is the step that will waste your afternoon. A file has to be served with `Access-Control-Allow-Origin`, and most sites do not. Test a candidate before building anything around it, from the browser console on the page that will use it:

```js
await fetch("https://example.test/line1.mp3", { method: "HEAD" });
// throws a CORS error   -> unusable, whatever the file is
// resolves              -> good
```

GitHub Pages and `raw.githubusercontent.com` are the known-good hosts here: the General MIDI banks and the shipped drum kits are both served from them. Committing your own MP3s to a repo and serving them from `gh-pages` is the path of least resistance. For public-domain readings, LibriVox recordings live on archive.org; check one with the snippet above before relying on it.

**2. Register the set.** Any MIDI note, any filename.
  </script>

  <script type="module" pinned>
sound.registerDrumKit("poem", {
  baseUrl: "https://example.test/poem/",   // trailing slash matters
  samples: {
    60: "line1.mp3",   // C4
    62: "line2.mp3",   // D4
    64: "line3.mp3",   // E4
    65: "line4.mp3",   // F4
  },
});
  </script>

  <script type="text/markdown">
**3. Write a track that plays only the notes you mapped.** This is not a style preference. `Sampler` transposes any note it was not given, to the nearest one it was: that is what makes a violin playable from 25 files, and what turns a sentence into a chipmunk. Mapped C4, D4, E4, F4 means those four pitches and no others.

**4. Turn off the two behaviours meant for instruments.**

- A note longer than its file is normally held by looping the sample's sustaining region. Right for a cello, wrong for a sentence — and the detection is acoustic, so a line ending on an open vowel gets looped. `loopSustain: false`.
- A note ends on a release fade. `release: 0` cuts where the note ends instead.

The note's `duration` is what stops the sample. Give it more than the recording lasts and you hear the whole thing; give it less and you cut the line short, which is usable on purpose.
  </script>

  <script type="module" pinned>
const poem = {
  title: "Four lines",
  tempo: 60,             // one beat is one second, so durations read as seconds
  tracks: [{
    label: "Voice",
    synth: { kit: "poem", loopSustain: false, options: { release: 0 } },
    notes: [
      { pitch: 60, duration: 5, time: 0 },
      { pitch: 62, duration: 5, time: 5 },
      { pitch: 64, duration: 5, time: 10 },
      { pitch: 65, duration: 7, time: 15 },
    ],
  }],
};

display(await jm.play(poem, { Tone, sound }));
  </script>

  <script type="text/markdown">
From there it is a normal JMON track, so everything else in this chapter applies: pan it, send it through a reverb in the `audioGraph`, layer it under a generated part, render the lot to WAV.

And since the pitches are only keys into a set of files, a generator can choose them. A random walk over `[60, 62, 64, 65]` reorders the stanzas; a cellular automaton decides which line speaks on which beat. The mapping is arbitrary, which is the point.
  </script>

  <script type="text/markdown">
## 5. Custom synth configuration

For more control, set `track.synth` to an object with `type` and `options`:
  </script>

  <script type="module" pinned>
const customPiece = {
  title: "Custom synth",
  tempo: 120,
  tracks: [{
    notes: melody,
    synth: {
      type: "FMSynth",
      options: {
        modulationIndex: 12,
        harmonicity: 3.01,
        envelope: {
          attack: 0.01,
          decay: 0.2,
          sustain: 0.3,
          release: 0.8
        }
      }
    }
  }]
};

display(await jm.play(customPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
You can also use a PolySynth with a specific voice type:
  </script>

  <script type="module" pinned>
const polyMonoPiece = {
  title: "PolySynth with MonoSynth voices",
  tempo: 120,
  tracks: [{
    notes: [
      { pitch: [60, 64, 67], duration: 2, time: 0, velocity: 0.7 },
      { pitch: [62, 65, 69], duration: 2, time: 2, velocity: 0.7 },
      { pitch: [64, 67, 72], duration: 2, time: 4, velocity: 0.7 },
      { pitch: [60, 64, 67], duration: 2, time: 6, velocity: 0.7 }
    ],
    synth: {
      type: "PolySynth",
      options: {
        voice: "MonoSynth"
      }
    }
  }]
};

display(await jm.score(polyMonoPiece, { verovio, VerovioToolkit }));
display(await jm.play(polyMonoPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
## 6. Audio effects with audioGraph

The `audioGraph` property on a composition defines a signal chain of audio effects. Each node has an `id`, `type`, `options`, and `target` (the next node in the chain).

The special target `"destination"` connects to the speaker output.
  </script>

  <script type="module" pinned>
// Melody with reverb
const reverbPiece = {
  title: "Melody with reverb",
  tempo: 120,
  tracks: [{ notes: melody }],
  audioGraph: [
    {
      id: "synth",
      type: "PolySynth",
      options: {},
      target: "reverb"
    },
    {
      id: "reverb",
      type: "Reverb",
      options: { decay: 3, wet: 0.4 },
      target: "destination"
    }
  ]
};

display(await jm.play(reverbPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
### Chaining effects

You can chain multiple effects by setting each node's `target` to the next node's `id`:
  </script>

  <script type="module" pinned>
// Effect chain: synth → chorus → delay → destination
const chainPiece = {
  title: "Effect chain",
  tempo: 100,
  tracks: [{ notes: melody }],
  audioGraph: [
    {
      id: "synth",
      type: "FMSynth",
      options: {},
      target: "chorus"
    },
    {
      id: "chorus",
      type: "Chorus",
      options: { frequency: 1.5, delayTime: 3.5, depth: 0.7, wet: 0.5 },
      target: "delay"
    },
    {
      id: "delay",
      type: "FeedbackDelay",
      options: { delayTime: 0.25, feedback: 0.3, wet: 0.3 },
      target: "destination"
    }
  ]
};

display(await jm.play(chainPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
### Available effects

All Tone.js effects are supported. Here are some useful ones:

| Effect | Description | Key options |
|--------|------------|-------------|
| Reverb | Room reverb | `decay`, `wet` |
| FeedbackDelay | Echo with feedback | `delayTime`, `feedback`, `wet` |
| PingPongDelay | Stereo ping-pong delay | `delayTime`, `feedback`, `wet` |
| Chorus | Chorus modulation | `frequency`, `delayTime`, `depth`, `wet` |
| Phaser | Phase shifting | `frequency`, `octaves`, `wet` |
| Distortion | Waveshaping distortion | `distortion`, `wet` |
| BitCrusher | Bit reduction | `bits`, `wet` |
| Freeverb | Algorithmic reverb | `roomSize`, `dampening`, `wet` |
| AutoFilter | LFO-controlled filter | `frequency`, `baseFrequency`, `wet` |
  </script>

  <script type="text/markdown">
### Alternative audioGraph format

You can also write audioGraph using the nodes/connections format, which is automatically normalized:
  </script>

  <script type="module" pinned>
const altFormatPiece = {
  title: "Nodes/connections format",
  tempo: 120,
  tracks: [{ notes: melody }],
  audioGraph: {
    nodes: [
      { id: "synth", type: "PolySynth" },
      { id: "reverb", type: "Reverb", params: { decay: 2, wet: 0.3 } }
    ],
    connections: [
      { from: "synth", to: "reverb" },
      { from: "reverb", to: "destination" }
    ]
  }
};

display(await jm.play(altFormatPiece, { Tone, sound }));
  </script>

  <script type="text/markdown">
## 7. Exporting to WAV

Use `jm.converters.downloadWav()` to render your composition to a WAV file. This uses Tone.js offline rendering, so what you hear in the player is what you get in the file.
  </script>

  <script type="module" pinned>
const wavPiece = {
  title: "WAV export example",
  tempo: 120,
  tracks: [
    { notes: melody, label: "Melody" }
  ]
};

// Renders the composition offline and returns a download link
display(await jm.converters.downloadWav(wavPiece, Tone, "melody.wav", undefined, { sound }));
  </script>

  <script type="text/markdown">
`downloadWav` renders the composition offline using `Tone.Offline()` and returns a clickable download link. The duration is auto-calculated from the composition.

It is reached as `jm.converters.downloadWav` because that is where you look for an export, but it lives with the players rather than the other converters: unlike `midi` or `musicxml`, which turn data into data, it drives the whole audio stack.

Parameters:
- `composition` — your JMON piece
- `Tone` — the Tone.js library
- `filename` — output filename (default: "composition.wav")
- `duration` — optional duration in seconds (auto-calculated if omitted)
- `options` — `{ sound }` for sampled instruments, the same provider `jm.play` takes

The WAV export renders the full audio chain — synth types, sampled instruments, audioGraph effects — through the same synth factory the player uses, so the file matches what you heard. Pass `sound` here too, or GM tracks render as synths.
  </script>

  <script type="text/markdown">
## 8. Exporting to MIDI

MIDI export converts your composition to a standard MIDI file. Unlike WAV, it carries note data rather than sound, which is what makes it portable: any DAW can open it and apply its own instruments.

What survives the round trip:

- **Exactly** — pitches, times, durations, tracks, `tempo` and `tempoMap` (one event per change), `timeSignature` / `timeSignatureMap`, `keySignature` / `keySignatureMap`, and glissando, portamento and bend, written as a pitch-bend sweep and read back as an articulation.
- **Approximately** — velocity, to within MIDI's 7 bits. And an accelerando: a tempo *ramp* has no MIDI message, so it is sampled as a staircase of tempo changes. Every DAW that shows you an accelerando is showing you steps.
- **Not at all** — synths, the `audioGraph`, effects, microtuning. Those are Tone-side, and a MIDI file has nowhere to put them.

`jm.converters.midiToJmon()` reads a file back, and needs no audio library — a MIDI file is just bytes.
  </script>

  <script type="module" pinned>
const midiPiece = {
  title: "MIDI export example",
  tempo: 120,
  tracks: [
    { notes: melody, label: "Melody" }
  ]
};

// Creates a download link for the MIDI file
display(jm.converters.midi(midiPiece, { filename: "melody.mid" }));
  </script>

  <script type="text/markdown">
The MIDI converter uses a built-in binary encoder with no external dependencies. It produces standard MIDI files (Format 1, 480 ticks per beat) compatible with any MIDI-capable software.
  </script>

  <script type="text/markdown">
## 9. Complete example

Let's combine everything: GM instruments, custom synths, effects, score rendering, and both export formats.
  </script>

  <script type="module" pinned>
// A short composition with multiple timbres
const pianoTrack = [
  { pitch: 60, duration: 1, time: 0, velocity: 0.7 },
  { pitch: 64, duration: 1, time: 1, velocity: 0.7 },
  { pitch: 67, duration: 1, time: 2, velocity: 0.7 },
  { pitch: 72, duration: 2, time: 3, velocity: 0.8 },
  { pitch: 67, duration: 1, time: 5, velocity: 0.7 },
  { pitch: 64, duration: 1, time: 6, velocity: 0.7 },
  { pitch: 60, duration: 2, time: 7, velocity: 0.7 }
];

const stringsTrack = [
  { pitch: [48, 52, 55], duration: 4, time: 0, velocity: 0.4 },
  { pitch: [47, 50, 55], duration: 4, time: 4, velocity: 0.4 }
];

const bassTrack = [
  { pitch: 36, duration: 2, time: 0, velocity: 0.6 },
  { pitch: 36, duration: 1, time: 2, velocity: 0.5 },
  { pitch: 43, duration: 1, time: 3, velocity: 0.6 },
  { pitch: 35, duration: 2, time: 4, velocity: 0.6 },
  { pitch: 35, duration: 1, time: 6, velocity: 0.5 },
  { pitch: 43, duration: 1, time: 7, velocity: 0.6 }
];

const fullPiece = {
  title: "Complete sound example",
  tempo: 100,
  keySignature: "C-major",
  tracks: [
    { notes: pianoTrack, synth: 0, label: "Piano" },
    { notes: stringsTrack, synth: 48, label: "Strings" },
    { notes: bassTrack, synth: 42, label: "Cello" }
  ]
};

display(await jm.score(fullPiece, { verovio, VerovioToolkit }));
display(await jm.play(fullPiece, { Tone, sound }));

// Export options
display(jm.converters.midi(fullPiece, { filename: "full-piece.mid" }));
  </script>
