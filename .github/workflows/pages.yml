# Assemble a static site for GitHub Pages. Nothing here needs a build step.
#
# Layout deployed:
#   /                    landing page (root index.html)
#   /live/               live coding REPL + iframe player
#   /src/                library source
#   /schemas/            JMON schema
#
# The user guide moved to jmon/studio and is not part of this site.
#
# One-time setup in repo Settings → Pages: set Source to "GitHub Actions".

name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one Pages deploy in flight; don't cancel an in-progress one
# (an interrupted Pages deploy can leave the site in a half-published state).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src     _site/src
          cp -r live    _site/live
          cp -r schemas _site/schemas

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
