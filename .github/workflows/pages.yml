# Build the userguide notebooks and assemble a static site for GitHub Pages.
#
# Layout deployed:
#   /                    landing page (root index.html)
#   /userguide/          notebook-kit output for chapters 01..10
#   /live/               live coding REPL + iframe player (static, no build)
#   /src/                library source (so userguide's ../src/index.js resolves)
#   /schemas/            JMON schema
#
# One-time setup in repo Settings → Pages: set Source to "GitHub Actions".

name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one Pages deploy in flight; don't cancel an in-progress one
# (an interrupted Pages deploy can leave the site in a half-published state).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: userguide/package-lock.json

      - name: Install userguide deps
        working-directory: userguide
        run: npm ci

      - name: Build userguide notebooks
        working-directory: userguide
        run: npm run build
        # Outputs to userguide/dist with the chapter HTMLs plus an
        # assets/ folder of bundled JS/CSS (Tone, Verovio, etc.).

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp index.html        _site/
          cp -r src            _site/src
          cp -r live           _site/live
          cp -r schemas        _site/schemas
          cp -r userguide/dist _site/userguide

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
