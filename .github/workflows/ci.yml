name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node:test + assert throughout — a broken assertion fails the build.
      # Listed explicitly rather than globbing tests/, because the remaining
      # legacy suites there (all-features, gaussian-processes, tone-esm-compat,
      # bun-compatibility) need npm dependencies this job does not install.
      - name: Unit tests
        run: |
          node --test \
            tests/music-theory.test.js \
            tests/key-context.test.js \
            tests/generative-algorithms.test.js \
            tests/analysis.test.js \
            tests/plot-data.test.js \
            tests/utils-transforms.test.js

      # Browser-load test — protects the jsDelivr distribution path.
      # Loads src/index.js the same way `import("https://cdn.jsdelivr.net
      # /gh/jmonlabs/algo@main/src/index.js")` does in the live REPL, and
      # asserts that `jm.key`, `jm.theory.harmony.Key`, etc. are wired up.
      # This is the test that would have caught the "jm.key is not a
      # function" regression we hit in jmonlabs/live.
      - name: Install puppeteer
        run: npm install --no-save puppeteer

      - name: Browser-load test
        run: node tests/browser-load.test.mjs
